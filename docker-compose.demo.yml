# Local demo only; opt in explicitly. Do not use this override on the VPS.
# docker compose --env-file docker-compose.demo.env -p qldetai-demo -f docker-compose.yml -f docker-compose.demo.yml up --build
# The MySQL entrypoint imports this seed only when initializing an empty volume.
services:
  mysql:
    volumes:
      # Runs after tables, foreign keys, required system data, views and triggers.
      - ./database/seed/demo-data.sql:/docker-entrypoint-initdb.d/60-demo-data.sql:ro
