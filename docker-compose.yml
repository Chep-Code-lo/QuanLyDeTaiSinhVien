services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --default-time-zone=+00:00
      # Bootstrap and migrations create triggers. MySQL requires this when binary
      # logging is enabled, including for users with TRIGGER privilege.
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting Docker Compose}
      MYSQL_DATABASE: ql_de_tai_sinh_vien
      MYSQL_USER: ${MYSQL_APP_USER:-ql_de_tai_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD before starting Docker Compose}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # MySQL executes only these ordered bootstrap files on a new, empty volume.
      # Do not mount the compatibility wrapper or any demo seed here.
      - ./database/bootstrap/00-create-database.sql:/docker-entrypoint-initdb.d/00-create-database.sql:ro
      - ./database/schema/01-tables-and-local-constraints.sql:/docker-entrypoint-initdb.d/10-tables.sql:ro
      - ./database/constraints/01-foreign-keys.sql:/docker-entrypoint-initdb.d/20-foreign-keys.sql:ro
      - ./database/seed/00-system-data.sql:/docker-entrypoint-initdb.d/30-system-data.sql:ro
      - ./database/objects/01-views.sql:/docker-entrypoint-initdb.d/40-views.sql:ro
      - ./database/objects/02-triggers.sql:/docker-entrypoint-initdb.d/50-triggers.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent --skip-column-names -e 'SELECT 1 FROM ql_de_tai_sinh_vien.roles LIMIT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db-migrate:
    image: flyway/flyway:13.10.3
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Flyway's MySQL driver connects over the private Compose network. Explicit
      # public-key retrieval keeps MySQL 8.4 caching_sha2_password authentication
      # reliable without depending on a self-signed TLS certificate.
      FLYWAY_URL: jdbc:mysql://mysql:3306/ql_de_tai_sinh_vien?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      FLYWAY_USER: ${MYSQL_APP_USER:-ql_de_tai_app}
      FLYWAY_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD before starting Docker Compose}
      # Existing deployments have no Flyway history. Baseline at 0, then apply
      # the guarded V001+ migrations once; no bootstrap file is re-run.
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "0"
      FLYWAY_DEFAULT_SCHEMA: ql_de_tai_sinh_vien
      FLYWAY_CREATE_SCHEMAS: "false"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./database/migrations:/flyway/sql:ro
    command: migrate

  file-storage-init:
    image: alpine:3
    user: "0:0"
    restart: "no"
    command: ["chown", "-R", "10001:10001", "/data/files"]
    volumes:
      - backend_files:/data/files

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      file-storage-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ql_de_tai_sinh_vien?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_APP_USER:-ql_de_tai_app}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD before starting Docker Compose}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}}
      FILE_STORAGE_ROOT: /data/files
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      CSRF_COOKIE_SAME_SITE: ${CSRF_COOKIE_SAME_SITE:-lax}
      CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN:-}
      MAIL_HOST: ${MAIL_HOST:-smtp-relay.brevo.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-thongbao@hackerlo.online}
      MAIL_ALLOWED_FROM: ${MAIL_ALLOWED_FROM:-thongbao@hackerlo.online}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-true}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-5000}
      MAIL_TIMEOUT_MS: ${MAIL_TIMEOUT_MS:-10000}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS:-10000}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_WORKER_DELAY_MS: ${EMAIL_WORKER_DELAY_MS:-5000}
      EMAIL_MAX_PER_RUN: ${EMAIL_MAX_PER_RUN:-10}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-4}
      EMAIL_RETRY_BASE_DELAY_SECONDS: ${EMAIL_RETRY_BASE_DELAY_SECONDS:-60}
      EMAIL_CLAIM_TIMEOUT_MINUTES: ${EMAIL_CLAIM_TIMEOUT_MINUTES:-15}
      EMAIL_DEADLINE_SCAN_DELAY_MS: ${EMAIL_DEADLINE_SCAN_DELAY_MS:-900000}
      EMAIL_DEADLINE_SCAN_WINDOW_MINUTES: ${EMAIL_DEADLINE_SCAN_WINDOW_MINUTES:-20}
      APP_BASE_URL: ${APP_BASE_URL:-https://hackerlo.online}
      APP_DISPLAY_TIME_ZONE: ${APP_DISPLAY_TIME_ZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_files:/data/files

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Expose only the web UI to the local Wi-Fi/LAN; the API and database
      # remain private behind the frontend reverse proxy.
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"

volumes:
  mysql_data:
  backend_files:
