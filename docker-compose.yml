services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-password-local}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-ql_de_tai_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-local}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/ql_de_tai_sinh_vien_schema.sql:/docker-entrypoint-initdb.d/00-ql_de_tai_sinh_vien_schema.sql:ro
      - ./docker/mysql/init/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -h localhost -u$$MYSQL_APP_USER -p$$MYSQL_APP_PASSWORD --silent --skip-column-names -e 'SELECT 1 FROM ql_de_tai_sinh_vien.roles LIMIT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ql_de_tai_sinh_vien?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_APP_USER:-ql_de_tai_app}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-change-me-local}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173},https://*.trycloudflare.com}
      FILE_STORAGE_ROOT: /data/files
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      CSRF_COOKIE_SAME_SITE: ${CSRF_COOKIE_SAME_SITE:-lax}
      CSRF_COOKIE_DOMAIN: ${CSRF_COOKIE_DOMAIN:-}
      # Local-development defaults. Override these to false/a private password
      # before using this compose file outside a demo environment.
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@123}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_files:/data/files

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Expose only the web UI to the local Wi-Fi/LAN; the API and database
      # remain private behind the frontend reverse proxy.
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-5173}:80"

volumes:
  mysql_data:
  backend_files:
