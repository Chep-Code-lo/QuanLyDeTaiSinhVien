spring.datasource.url=jdbc:h2:mem:qldetai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.cors.allowed-origins=http://localhost:5173
app.security.csrf.cookie.same-site=lax
app.security.csrf.cookie.secure=false
app.security.csrf.cookie.domain=
app.email.enabled=false
app.email.default-from=thongbao@test.local
app.email.allowed-from-addresses=thongbao@test.local
app.email.base-url=http://localhost:5173
app.email.display-time-zone=Asia/Ho_Chi_Minh
