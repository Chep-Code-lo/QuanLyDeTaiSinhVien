spring.application.name=backend

# MySQL database created by database/ql_de_tai_sinh_vien_schema.sql.
# DB_URL, DB_USERNAME and DB_PASSWORD can be supplied as environment variables
# when deploying; the values after ':' are the local-development defaults.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ql_de_tai_sinh_vien?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The SQL script owns the schema (including views and triggers), so Hibernate
# must not create, update, or drop database objects.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.timeout=${SESSION_TIMEOUT:4h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.demo-data.password=${DEMO_PASSWORD:}
