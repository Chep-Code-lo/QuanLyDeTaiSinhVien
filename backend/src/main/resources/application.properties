spring.application.name=backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# MySQL database created by database/ql_de_tai_sinh_vien_schema.sql.
# DB_URL, DB_USERNAME and DB_PASSWORD can be supplied as environment variables
# when deploying; the values after ':' are the local-development defaults that
# match the docker-compose MySQL service exposed on localhost.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/ql_de_tai_sinh_vien?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${MYSQL_APP_USER:ql_de_tai_app}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_APP_PASSWORD:change-me-local}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The SQL script owns the schema (including views and triggers), so Hibernate
# must not create, update, or drop database objects.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${SERVER_PORT:${BACKEND_PORT:8080}}
# Nginx preserves the public HTTPS scheme and host supplied by Cloudflare Tunnel.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}
server.servlet.session.timeout=${SESSION_TIMEOUT:4h}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.trycloudflare.com}
app.files.storage-root=${FILE_STORAGE_ROOT:${java.io.tmpdir}/qldetai-files}
app.security.csrf.cookie.same-site=${CSRF_COOKIE_SAME_SITE:${SESSION_COOKIE_SAME_SITE:lax}}
app.security.csrf.cookie.secure=${CSRF_COOKIE_SECURE:${SESSION_COOKIE_SECURE:false}}
app.security.csrf.cookie.domain=${CSRF_COOKIE_DOMAIN:}

# SMTP credentials are supplied only by the deployment environment.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}

app.email.enabled=${EMAIL_ENABLED:false}
app.email.default-from=${MAIL_FROM:thongbao@hackerlo.online}
app.email.allowed-from-addresses=${MAIL_ALLOWED_FROM:${MAIL_FROM:thongbao@hackerlo.online}}
app.email.base-url=${APP_BASE_URL:http://localhost:5173}
app.email.display-time-zone=${APP_DISPLAY_TIME_ZONE:Asia/Ho_Chi_Minh}
app.email.worker-delay-ms=${EMAIL_WORKER_DELAY_MS:5000}
app.email.max-per-run=${EMAIL_MAX_PER_RUN:10}
app.email.max-attempts=${EMAIL_MAX_ATTEMPTS:4}
app.email.retry-base-delay-seconds=${EMAIL_RETRY_BASE_DELAY_SECONDS:60}
app.email.claim-timeout-minutes=${EMAIL_CLAIM_TIMEOUT_MINUTES:15}
app.email.deadline-scan-delay-ms=${EMAIL_DEADLINE_SCAN_DELAY_MS:900000}
app.email.deadline-scan-window-minutes=${EMAIL_DEADLINE_SCAN_WINDOW_MINUTES:20}
